<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>东财明天炒什么</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: #000;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    font-size: 14px;
}

.wrapper {
    display: flex;
    height: 100vh;
    padding-top: 2px;
}

.left, .right {
    width: 50%;
    height: 100%;
    overflow-y: auto;
    background: #000;
}
.left {
    width: 50%;
    height: 100%;
    overflow-y: auto;
    background: #000;
    border-right: 1px solid #111;
    padding: 10px 12px 20px;
}

.right {
    padding: 0;
    background: #000;
}

.left-header {
    color: #f3c14b;
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 8px;
    letter-spacing: .3px;
}

.date-bar {
    display: flex;
    align-items: center;
    height: 45px;
    box-sizing: border-box;
    padding: 0 14px;
    font-size: 20px;
    font-weight: 700;
    color: #ccc;
    border-bottom: 2px solid #444;
    background: #000;
    margin-bottom: 8px;
}

.card {
    background: #050505;
    border: 1px solid #131313;
    border-radius: 8px;
    padding: 10px 12px;
    margin: 10px 0;
    cursor: pointer;
    transition: background .12s, border-color .12s;
}
.card:hover { background: #222; border-color: #1c1c1c; }
.card.active {
    background: #0b0b0b;
    border-color: #2a2a2a;
}

/* 序号/题材名/热 */
.theme-head {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
    flex-wrap: wrap;
}

.rank {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
}
.rank-1 { background: #d93025; }
.rank-2 { background: #e8741d; }
.rank-3 { background: #e8911d; }
.rank-def { background: #2a2a2a; color: #bdbdbd; }

.theme-name {
    display: inline-flex;
    align-items: center;
    height: 22px;
    color: #1a1a1a;
    font-weight: 700;
    font-size: 14px;
    line-height: 22px;
    padding: 0 6px;
    background: #f3c14b;
    border-radius: 3px;
    white-space: nowrap;
}

.zt-num {
    display: inline-flex;
    align-items: center;
    height: 22px;
    font-size: 12px;
    color: #ff4d4f;
    background: rgba(255,77,79,.10);
    border: 1px solid rgba(255,77,79,.25);
    padding: 0 6px;
    border-radius: 4px;
    white-space: nowrap;
    flex-shrink: 0;
}

.hot-mini {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 22px;
    padding: 0 5px;
    font-size: 12px;
    color: #fff;
    background: #d93025;
    border-radius: 3px;
    font-weight: 700;
    flex-shrink: 0;
    white-space: nowrap;
}

.limit-tag {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 22px;
    padding: 0 5px;
    font-size: 11px;
    color: #ffb38a;
    background: #2b1410;
    border: 1px solid #4a2018;
    border-radius: 3px;
    white-space: nowrap;
    flex-shrink: 0;
}

.theme-main-title {
    width: 100%;
    font-size: 16px;
    color: #ffcc00;
    font-weight: 700;
    line-height: 24px;
    margin-top: 3px;
    text-align: left;
}

.theme-desc {
    font-size: 14px;
    color: #ccc;
    line-height: 1.7;
    margin: 4px 0 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-align: left;
}

.rel-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}
.rel-tag {
    display: inline-flex;
    align-items: center;
    background: #111;
    border: 1px solid #1f1f1f;
    border-radius: 10px;
    padding: 3px 8px;
    font-size: 12px;
    color: #d6d6d6;
    line-height: 16px;
}
.rel-icon {
    font-size: 11px;
    margin-right: 4px;
    opacity: .8;
}
.rel-chg.up { color: #f14c4c; margin-left: 2px; font-weight: 600; }
.rel-chg.down { color: #0ecd90; margin-left: 2px; font-weight: 600; }

/* 右侧 */
.right-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid #1a1a1a;
    background: #000;
    position: sticky;
    top: 0;
    z-index: 10;
}
.right-topbar h2 {
    font-size: 20px;
    font-weight: 700;
    color: #ccc;
}
.stock-count {
    font-size: 18px;
    color: #ccc;
    font-weight: 400;
    margin-left: 4px;
}
.collect-btn {
    background: #f3c14b;
    color: #1a1a1a;
    border: none;
    border-radius: 2px;
    padding: 4px 14px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}
.collect-btn:hover { background: #e5b13a; }

.stock-row {
    padding: 9px 14px;
    border-bottom: 1px solid #1a1a1a;
    cursor: pointer;
    transition: background .1s;
}
.stock-row:hover { background: #222; }

.stock-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.stock-left {
    display: flex;
    align-items: center;
    gap: 6px;
}
.stock-name {
    font-size: 16px;
    font-weight: 700;
    color: #ccc;
}
.stock-code {
    font-size: 16px;
    color: #ccc;
}
.label-tag {
    font-size: 14px;
    color: #f3c14b;
    border: 1px solid #5a4315;
    padding: 0 4px;
    border-radius: 2px;
}

.chg {
    font-size: 14px;
    font-weight: 700;
}
.chg-up { color: #f14c4c; }
.chg-down { color: #0ecd90; }

.reason {
    font-size: 14px;
    color: #ccc;
    line-height: 1.6;
    margin-top: 3px;
}

.loading {
    text-align: center;
    color: #555;
    padding: 30px;
    font-size: 14px;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #000; }
::-webkit-scrollbar-thumb { background: #222; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #333; }
</style>
</head>
<body>

<div class="wrapper">
    <div class="left">
        <div id="loading" class="loading">加载中...</div>
        <div id="list"></div>
    </div>

    <div class="right">
        <div class="right-topbar">
            <h2>成分股 <span class="stock-count" id="count"></span></h2>
            <button class="collect-btn" onclick="addToBlock()">加入板块</button>
        </div>
        <div id="stocks"></div>
    </div>
</div>

<script>
const THEME_API = 'https://emcfgdata.eastmoney.com/api/themeInvest/getFryTomorrowList';
const STOCK_API = 'https://emcfgdata.eastmoney.com/api/themeInvest/getStockList';

let themeData = [];
let stockCache = new Map();
let activeCode = null;

function randomCode() {
    const c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456786';
    let s = '';
    for (let i = 0; i < 32; i++) s += c[Math.floor(Math.random() * c.length)];
    return s;
}

async function fetchThemes() {
    const res = await fetch(THEME_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            args: { pageSize: 50, lastTradeDate: '' },
            client: 'wap',
            clientType: 'cfw',
            clientVersion: '9001',
            randomCode: randomCode(),
            timestamp: String(Date.now())
        })
    });
    return res.json();
}

async function fetchStocks(themeCode) {
    const res = await fetch(STOCK_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            args: { themeCode, pageSize: 1000, pageNum: 1, sort: -1, sortField: 'f3' },
            client: 'web',
            clientVersion: '8.3',
            clientType: 'cfw',
            randomCode: randomCode(),
            timestamp: Date.now()
        })
    });
    return res.json();
}

function renderThemeList() {
    const container = document.getElementById('list');
    const frag = document.createDocumentFragment();

    const groups = {};
    themeData.forEach(t => {
        const d = t.tradeDate || '未知';
        if (!groups[d]) groups[d] = [];
        groups[d].push(t);
    });

    let globalIdx = 0;

    for (const date in groups) {
        const dateDiv = document.createElement('div');
        dateDiv.className = 'date-bar';
        dateDiv.textContent = date;
        frag.appendChild(dateDiv);

        groups[date].forEach(t => {
            globalIdx++;
            const card = document.createElement('div');
            card.className = 'card' + (t.themeCode === activeCode ? ' active' : '');
            card.onclick = () => onThemeClick(t.themeCode);

            const n = globalIdx;
            let rankCls = 'rank';
            if (n === 1) rankCls += ' rank-1';
            else if (n === 2) rankCls += ' rank-2';
            else if (n === 3) rankCls += ' rank-3';
            else rankCls += ' rank-def';

            const hotHtml = t.isHot ? '<span class="hot-mini">HOT</span>' : '';
            const limitHtml = t.limitCount !== undefined && t.limitCount !== null
                ? `<span class="limit-tag">涨停 ${t.limitCount}</span>`
                : '';

            const stockList = (t.stockList || []).slice(0, 2);
            const relHtml = stockList.map(s => {
                const sChg = s.f3 || 0;
                const sCls = sChg > 0 ? 'rel-chg up' : sChg < 0 ? 'rel-chg down' : 'rel-chg';
                const sSign = sChg > 0 ? '+' : '';
                return `<span class="rel-tag"><span class="rel-icon">&#128279;</span>${s.name || ''} <span class="${sCls}">${sSign}${sChg}%</span></span>`;
            }).join('');

            const themeNameHtml = t.themeName ? `<span class="theme-name">${t.themeName}</span>
${t.fex3 > 0 ? `<span class="zt-num"> ${t.fex3} 只涨停</span>` : ''}` : '';

            card.innerHTML = `
                <div class="theme-head">
                    <span class="${rankCls}">${n}</span>
                    ${themeNameHtml}
                    ${limitHtml}
                    ${hotHtml}
                    <div class="theme-main-title">${t.title || ''}</div>
                </div>
                <div class="theme-desc">${t.summary || ''}</div>
                <div class="rel-tags">${relHtml}</div>
            `;
            frag.appendChild(card);
        });
    }

    container.innerHTML = '';
    container.appendChild(frag);
}

async function onThemeClick(code) {
    activeCode = code;
    renderThemeList();

    if (stockCache.has(code)) {
        renderStockList(stockCache.get(code));
        return;
    }

    const container = document.getElementById('stocks');
    container.innerHTML = '<div class="loading">成分股加载中...</div>';
    document.getElementById('count').textContent = '';

    try {
        const json = await fetchStocks(code);
        const list = (json.data && json.data.stockList) ? json.data.stockList : [];
        stockCache.set(code, list);
        renderStockList(list);
    } catch (e) {
        container.innerHTML = '<div class="loading">加载失败，请重试</div>';
    }
}

function renderStockList(list) {
    document.getElementById('count').textContent = `(${list.length})`;
    const container = document.getElementById('stocks');
    const frag = document.createDocumentFragment();

    list.forEach(s => {
        const row = document.createElement('div');
        row.className = 'stock-row';
        row.onclick = () => openQuote(s);

        const chgCls = s.f3 > 0 ? 'chg chg-up' : s.f3 < 0 ? 'chg chg-down' : 'chg';
        const sign = s.f3 > 0 ? '+' : '';
        const label = s.label ? `<span class="label-tag">${s.label}</span>` : '';
        const reason = (s.keywordList || []).map(k =>
            `<div class="reason">${k.introduction}</div>`
        ).join('');

        row.innerHTML = `
            <div class="stock-top">
                <div class="stock-left">
                    <span class="stock-name">${s.securityName}</span>
                    <span class="stock-code">(${s.codeSuffix || s.securityCode})</span>
                    ${label}
                    <span class="${chgCls}">${sign}${s.f3}%</span>
                </div>
            </div>
            ${reason}
        `;
        frag.appendChild(row);
    });

    container.innerHTML = '';
    container.appendChild(frag);
}

function openQuote(s) {
    const suffix = s.codeSuffix || s.securityCode;
    const [pure, market] = suffix.split('.');
    if (!pure) return;
    window.location.href = `http://www.treeid/code_${pure}`;
}

function addToBlock() {
    const rows = document.querySelectorAll('.stock-row');
    if (!rows.length) return;

    const codes = [];
    rows.forEach(row => {
        const codeSpan = row.querySelector('.stock-code');
        if (!codeSpan) return;
        const suffix = codeSpan.textContent;
        const [pure, market] = suffix.split('.');
        const prefix = market === 'SH' ? '1#' : market === 'BJ' ? '2#' : '0#';
        codes.push(prefix + pure);
    });

    if (!codes.length) return;
    const txt = codes.join('|');
    const url = 'http://www.treeid/AddToBlock_2#' + txt;

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).catch(() => {});
    }

    window.location.href = url;
}

(async function init() {
    try {
        const json = await fetchThemes();
        themeData = json.data || [];

        document.getElementById('loading').style.display = 'none';
        renderThemeList();

        if (themeData.length) {
            onThemeClick(themeData[0].themeCode);
        } else {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loading').textContent = '暂无数据';
        }
    } catch (e) {
        console.error(e);
        document.getElementById('loading').textContent = '加载失败，请刷新页面重试';
    }
})();
</script>

</body>
</html>
