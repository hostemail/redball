<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开盘啦明天炒什么</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        .page-container {
            display: flex;
            height: 100vh;
        }
        .news-container {
            width: 50%;
            overflow-y: auto;
            padding: 5px;
            border-right: 1px solid #333;
        }
        .detail-container {
            width: 50%;
            overflow-y: auto;
            padding: 20px;
            background: #222;
        }
        .date-group {
            margin-bottom: 10px;
        }
        .date {
            color: #E5E7EB;
            font-size: 17px;
            padding: 10px 0;
        }
        .news-item {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 5px;
            margin-bottom: 5px;
            cursor: pointer;
            border: 1px solid #333;
            transition: all 0.3s ease;
        }
        .news-item.active {
            border-color: #1890ff;
            background: #2a2a2a;
        }
        .news-header {
            display: flex;
        }
        .news-index {
            color: #888;
            margin-right: 10px;
            min-width: 20px;
        }
        .news-content {
            flex: 1;
        }
        .news-main {
            display: flex;
            justify-content: space-between;
        }
        .news-title {
            flex: 1;
            font-size: 14px;
            margin-right: 15px;
            color: #fff;
        }
        .hot-info {
            text-align: right;
            min-width: 80px;
        }
        .hot-value {
            color: #ff4d4f;
            font-weight: bold;
        }
        .hot-icons {
            color: #ff4d4f;
            margin-top: 4px;
        }
        .detail-content {
            font-size: 14px;
            line-height: 1.6;
            color: #ccc;
            margin-bottom: 15px;
            white-space: pre-line;
        }
        .stock-list {
            background: #2a2a2a;
            border-radius: 4px;
            padding: 10px;
            margin-top: 20px;
        }
        .stock-list-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
        }
        .stock-item {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .stock-item:hover {
            background-color: #333;
        }
        .stock-item:last-child {
            border-bottom: none;
        }
        .stock-info {
            display: flex;
            align-items: center;
        }
        .stock-name {
            color: #fff;
            margin-right: 10px;
        }
        .stock-code {
            color: #888;
            font-size: 13px;
        }
        .stock-tag {
            display: inline-block;
            background: #ff4d4f33;
            color: #ff4d4f;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 8px;
        }
        .loading {
            text-align: center;
            color: #888;
            padding: 20px;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-track {
            background: #222;
        }
        .empty-detail {
            color: #666;
            text-align: center;
            padding: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="news-container" id="newsList"></div>
        <div class="detail-container" id="detailContainer">
            <div class="loading">加载中...</div>
        </div>
    </div>

    <script>
        async function fetchNews() {
            try {
                const response = await fetch('https://applhb.longhuvip.com/w1/api/index.php?Index=0&PhoneOSNew=2&VerSion=5.16.0.3&a=InfoList&apiv=w38&c=Topic&st=15');
                const data = await response.json();
                if(data.errcode === "0") {
                    renderNews(data.List);
                }
            } catch (error) {
                console.error('获取数据失败:', error);
            }
        }

        async function fetchDetail(id) {
            try {
                const response = await fetch(`https://applhb.longhuvip.com/w1/api/index.php?ID=${id}&PhoneOSNew=2&VerSion=5.16.0.3&a=InfoGet&apiv=w38&c=Topic`);
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('获取详情失败:', error);
                return null;
            }
        }

        async function fetchStockList(themeId) {
            try {
                const response = await fetch(`https://applhb.longhuvip.com/w1/api/index.php?ID=${themeId}&PhoneOSNew=2&VerSion=5.16.0.3&a=InfoGet&apiv=w38&c=Theme`);
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('获取股票列表失败:', error);
                return null;
            }
        }

        function formatHotVal(val) {
            if (val >= 10000) {
                return (val / 10000).toFixed(2) + 'w';
            }
            return val;
        }

        function getHotIcons(hotTag) {
            return '🔥'.repeat(hotTag);
        }

        async function showDetail(newsItem, id) {
            // 移除其他项目的active状态
            document.querySelectorAll('.news-item').forEach(item => {
                item.classList.remove('active');
            });
            // 添加当前项目的active状态
            newsItem.classList.add('active');

            const detailContainer = document.getElementById('detailContainer');
            detailContainer.innerHTML = '<div class="loading">加载中...</div>';

            const detail = await fetchDetail(id);
            if (detail) {
                let stockListHTML = '';
                if (detail.ThemeID) {
                    const stocksData = await fetchStockList(detail.ThemeID);
                    if (stocksData && stocksData.StockList && stocksData.StockList.length > 0) {
                        const sortedStocks = [...stocksData.StockList].sort((a, b) => {
                            return parseInt(b.HotNum) - parseInt(a.HotNum);
                        });

                        stockListHTML = `
                            <div class="stock-list">
                                <div class="stock-list-title">相关股票</div>
                                ${sortedStocks.map(stock => `
                                    <div class="stock-item" onclick="window.location.href='http://www.treeid/code_${stock.StockID}'">
                                        <div class="stock-info">
                                            <span class="stock-name">${stock.prod_name}</span>
                                            <span class="stock-code">${stock.StockID}</span>
                                            ${stock.Tag && stock.Tag.length > 0 ? `
                                                <span class="stock-tag">${stock.Tag[0].Name}</span>
                                            ` : ''}
                                        </div>
                                        <div class="hot-value">${stock.HotNum}</div>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    }
                }

                detailContainer.innerHTML = `
                    <div class="detail-content">${detail.Content || ''}</div>
                    ${stockListHTML}
                `;
            } else {
                detailContainer.innerHTML = '<div class="loading">获取详情失败</div>';
            }
        }

        function renderNews(newsGroups) {
            const container = document.getElementById('newsList');
            container.innerHTML = '';

            newsGroups.forEach((group, groupIndex) => {
                const dateGroup = document.createElement('div');
                dateGroup.className = 'date-group';
                
                dateGroup.innerHTML = `
                    <div class="date">${group.Day}</div>
                    ${group.List.map((item, index) => `
                        <div class="news-item" data-id="${item.ID}">
                            <div class="news-header">
                                <span class="news-index">${index + 1}</span>
                                <div class="news-content">
                                    <div class="news-main">
                                        <div class="news-title">${item.Title}</div>
                                        <div class="hot-info">
                                            <div class="hot-value">${formatHotVal(item.HotVal)}</div>
                                            <div class="hot-icons">${getHotIcons(item.HotTag)}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                `;
                container.appendChild(dateGroup);
            });

            document.querySelectorAll('.news-item').forEach(item => {
                item.addEventListener('click', function() {
                    const id = this.dataset.id;
                    showDetail(this, id);
                });
            });

            const firstNewsItem = document.querySelector('.news-item');
            if (firstNewsItem) {
                firstNewsItem.click();
            }
        }

        document.addEventListener('DOMContentLoaded', fetchNews);
    </script>
</body>
</html>
