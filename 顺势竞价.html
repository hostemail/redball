    <div class="stock-pool-panel"><div class="pool-header"><div class="pool-title"><i class="fa fa-database"></i> 策略股票池 (前五智选) <span id="autoAddStatusTag">⏳ 9:30前自动收录前五</span><span id="poolExpiryInfo" style="font-size:11px; margin-left:8px;"></span></div><div class="pool-buttons"><button id="manualAddCurrentBtn" class="pool-btn"><i class="fa fa-plus-circle"></i> 加入当前前五入池</button><button id="clearPoolBtn" class="pool-btn"><i class="fa fa-trash-o"></i> 清空池</button><button id="exportPoolBtn" class="pool-btn"><i class="fa fa-share-square-o"></i> 导出池</button></div></div><div id="poolListContainer" class="pool-list"><div class="empty-pool">暂无股票，9:30前系统自动将前五名选入池中</div></div></div>

    <!-- 全部股票区域：上方放置导出按钮及统计 -->
    <div class="flex-between">
        <div class="stats-badge" id="stockCountBadge">符合条件: --只</div>
        <button id="exportAllBtn" class="tdx-export-btn"><i class="fa fa-download"></i> 导出全部结果代码</button>
    </div>
    <div id="allStockTableArea" class="stock-table-container"><div class="loading-placeholder"><div class="spinner"></div>加载选股数据(四维积分制)...</div></div>
    <div class="footnote"><i class="fa fa-bullhorn"></i> 评分维度:价格(30)+量能(30)+封单强度(20)+板块地位(20) | 红线(竞价翻绿/量比＜0.3)触发后最高45分 | 竞价涨幅下限默认0%以展示更多标的 | 点击代码唤起通达信/同花顺 · 🌐网页K线 </div>
</div>

<script>
    (function(){
        // 市场范围构建
        function buildMarketFs(){
            let parts=[];
            if(document.getElementById('marketMainBoard')?.checked) parts.push('m:1+t:2','m:0+t:6');
            if(document.getElementById('marketSciTech')?.checked) parts.push('m:1+t:23');
            if(document.getElementById('marketGrowth')?.checked) parts.push('m:0+t:80');
            if(parts.length===0) return 'm:1+t:2,m:0+t:6,m:1+t:23,m:0+t:80';
            return parts.join(',');
        }
        function getStockApiUrl(){ return `https://push2dycalc.eastmoney.com/api/qt/clist/get?fs=${buildMarketFs()}&fltt=2&invt=2&fields=f2,f3,f4,f5,f6,f8,f10,f12,f14,f17,f18,f20,f21,f26,f104,f615,f630,f100,f102,f103&fid=f3&po=1&pn=1&pz=500&np=1&ut=c92c50e6b0fab2c17cd5e276e9a79c42`; }

        let cachedStocks=[], allRawStocks=[], isDataCached=false;
        let filterSettings={ stSuspend:true, excludeNewStock:true, bidEnabled:true, bidMin:0, bidMax:20, mvEnabled:true, mvMin:5, mvMax:300, boardEnabled:true, boardMin:0, boardMax:6, priceEnabled:true, priceMin:2, priceMax:100 };
        let isFilterLocked=false; const LOCKED_FILTER_KEY='shunshi_locked_filter_v9';
        let stockPool=[], autoPoolLockTime=null; const STORAGE_KEY='shunshi_stock_pool_v5', LOCK_DURATION_MS=10*3600000;
        
        // 辅助函数
        function getListingDays(str){ if(!str)return null; let s=str.toString(); if(s.length===8){ let y=parseInt(s.substr(0,4)),m=parseInt(s.substr(4,2))-1,d=parseInt(s.substr(6,2)); return (new Date()-new Date(y,m,d))/(86400000); } return null; }
        function isST(n){ return n.includes('ST')||n.includes('*ST'); }
        function isSuspended(s){ return (s.f4||0)<=0||(s.f5||0)===0; }
        function getBidChange(s){ let v=(s.f615!=null && !isNaN(s.f615))?parseFloat(s.f615):parseFloat(s.f3||0); return v; }
        function getEntityChange(s){ let o=parseFloat(s.f17||0),c=parseFloat(s.f2||0); return o===0?0:((c-o)/o)*100; }
        // 模拟量比: 基于竞价换手率映射量比阈值（符合常规）
        function getSimulatedVolumeRatio(stock){ let bidTurn = 0; try{ let bv=parseFloat(stock.f5||0), mv=parseFloat(stock.f10||0), p=parseFloat(stock.f2||0); if(mv>0 && p>0 && bv>0) bidTurn = (bv * p) / (mv * 100); }catch(e){} if(bidTurn>=0.8) return 1.5; if(bidTurn>=0.5) return 1.0; if(bidTurn>=0.3) return 0.5; if(bidTurn>=0.15) return 0.3; return 0.2; }
        function getVolumeScoreFromRatio(ratio){ if(ratio>=1.5) return 30; if(ratio>=1.0) return 25; if(ratio>=0.5) return 20; if(ratio>=0.3) return 10; return 0; }
        function checkRedLine(bidChange, volumeRatio){ return (bidChange<0) || (volumeRatio<0.3); }

        function getSectorScore(stock, sectorRankMap){ let industry=stock.industry||''; if(!industry) return 5; let rankInfo=sectorRankMap.get(industry); if(!rankInfo) return 5; let rank=rankInfo.rankMap.get(stock.code)||999; let total=rankInfo.total; let mv=stock.circulationMV||0; let isTop= rank<=Math.max(1,Math.floor(total*0.15)); let isFront= rank<=Math.max(3,Math.floor(total*0.3)); if(isTop && mv<80) return 20; if(isTop) return 18; if(isFront && mv<120) return 15; if(isFront) return 12; if(rank<=Math.min(8,total*0.5)) return 8; return 5; }
        
        function getStrengthScore(stock, volumeRatio){ let price=stock.price, yesterdayClose=stock.rawStock?.f4; if(!yesterdayClose||yesterdayClose<=0) return 12; let limitUpPct= (stock.code.startsWith('688')||stock.code.startsWith('30'))?0.2:0.1; let limitPrice=yesterdayClose*(1+limitUpPct); let distanceToLimit=Math.max(0,(limitPrice-price)/limitPrice); let priceStability=10*(1-Math.min(1,distanceToLimit)); let momentum=Math.min(10, (volumeRatio/1.5)*10); let total=priceStability+momentum; return Math.min(20,Math.max(10,total)); }
        
        function getPriceScore(bidChange, stock){ let price=stock.price, yesterdayClose=stock.rawStock?.f4; let isYiZi=false; if(yesterdayClose && yesterdayClose>0){ if(price/yesterdayClose>=0.995 && bidChange>=9.5) isYiZi=true; } if(isYiZi) return 30; if(bidChange>=9.9) return 30; if(bidChange>=7) return 25; if(bidChange>=5) return 20; if(bidChange>=3) return 10; if(bidChange<0) return 0; return 5; }

        function computeNewScore(stock, sectorRankMap){
            let bidChange=stock.bidChange;
            let volRatio=getSimulatedVolumeRatio(stock.rawStock);
            let priceScore=getPriceScore(bidChange, stock);
            let volumeScore=getVolumeScoreFromRatio(volRatio);
            let strengthScore=getStrengthScore(stock, volRatio);
            let sectorScore=getSectorScore(stock, sectorRankMap);
            let total=priceScore+volumeScore+strengthScore+sectorScore;
            let redLineTrigger=checkRedLine(bidChange, volRatio);
            if(redLineTrigger) total=Math.min(total,45);
            total=Math.min(100,Math.max(0,total));
            let confidence= total>=80?88: total>=70?78: total>=60?70: total>=50?62: total>=40?52:45;
            return { total:Math.round(total), confidence:Math.round(confidence), redFlag:redLineTrigger };
        }

        function buildSectorRankMap(stocksArr){
            let sectorMap=new Map();
            stocksArr.forEach(s=>{ let ind=s.industry||''; if(ind){ if(!sectorMap.has(ind)) sectorMap.set(ind,[]); sectorMap.get(ind).push({code:s.code,bidChange:s.bidChange}); } });
            let rankMap=new Map();
            for(let [ind,list] of sectorMap.entries()){ list.sort((a,b)=>b.bidChange-a.bidChange); let rmap=new Map(); list.forEach((item,idx)=>rmap.set(item.code,idx+1)); rankMap.set(ind,{rankMap:rmap,total:list.length}); }
            return rankMap;
        }

        function applyNewFilters(stockList){ return stockList.filter(item=>{ let raw=item.rawStock; if(filterSettings.stSuspend && (isST(item.name)||isSuspended(raw))) return false; if(filterSettings.excludeNewStock && raw && raw.f26){ let days=getListingDays(raw.f26); if(days!==null && days<60) return false; } let bid=item.bidChange; if(filterSettings.bidEnabled && (bid<filterSettings.bidMin || bid>=filterSettings.bidMax)) return false; let mv=item.circulationMV; if(filterSettings.mvEnabled && (mv<filterSettings.mvMin || mv>filterSettings.mvMax)) return false; let board=item.boardCount; if(filterSettings.boardEnabled && (board<filterSettings.boardMin || board>filterSettings.boardMax)) return false; let price=item.price; if(filterSettings.priceEnabled && (price<filterSettings.priceMin || price>filterSettings.priceMax)) return false; return true; }); }

        function processAllStocks(rawStocks){
            let baseList=rawStocks.map(stock=>{
                let bidChange=getBidChange(stock);
                let realChange=parseFloat(stock.f3||0);
                let circulationMV=parseFloat(stock.f21||0)/100000000;
                let price=parseFloat(stock.f2||0);
                let boardCount=0; if(stock.f104) boardCount=Math.min(parseInt(stock.f104)||0,20);
                let warnType=parseInt(stock.f630||0);
                let industry=stock.f100||'-';
                let concept=stock.f103||'-';
                return { code:stock.f12, name:stock.f14, bidChange, realChange, circulationMV, price, boardCount, warnType, industry, concept, rawStock:stock, entityChange:getEntityChange(stock) };
            });
            let sectorRankMap=buildSectorRankMap(baseList);
            let enriched=baseList.map(stk=>{ let {total,confidence}=computeNewScore(stk, sectorRankMap); stk.probability=total; stk.confidence=confidence; return stk; });
            enriched.sort((a,b)=>b.probability - a.probability);
            return applyNewFilters(enriched);
        }

        function generateMockRawStocks() {
            const names = ['科技龙头', '新能源A', '医药创新', '消费升级', '金融服务', '智能制造', '周期复苏', '成长潜力', '价值投资', '蓝筹精选', '半导体', '光伏产业', '锂电池', '人工智能', '数字经济'];
            const industries = ['电子元件', '新能源', '医药生物', '食品饮料', '银行', '机械设备', '化工', '计算机', '家用电器', '汽车'];
            const concepts = ['光伏概念|新能源', '锂电池|新能源车', '人工智能|ChatGPT', '半导体|芯片', '一带一路', '国企改革', '数字经济', '军工|航天', '元宇宙|虚拟现实', '跨境电商'];
            
            const mockStocks = [];
            for (let i = 0; i < 50; i++) {
                const code = ['60', '00', '30', '68'][i % 4] + String(1000 + i).padStart(4, '0');
                const name = names[i % names.length] + (Math.floor(i / names.length) + 1);
                const price = parseFloat((Math.random() * 150 + 2).toFixed(2));
                const mvYi = parseFloat((Math.random() * 200 + 5).toFixed(2));
                const f21 = Math.round(mvYi * 100000000);
                const f3 = parseFloat((Math.random() * 10 - 2).toFixed(2));
                const f615 = parseFloat((Math.random() * 14 + 1).toFixed(2));
                const f104 = Math.floor(Math.random() * 4);
                const f26 = new Date(Date.now() - Math.random() * 365 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
                
                mockStocks.push({
                    f2: price,
                    f3: f3,
                    f4: price / (1 + f3 / 100),
                    f5: Math.random() * 100000 + 10000,
                    f6: price * (1 + Math.random() * 0.05 - 0.025),
                    f8: Math.random() * 5 + 0.5,
                    f10: Math.random() * 5 + 0.5,
                    f12: code,
                    f14: name,
                    f17: price * (1 + Math.random() * 0.02 - 0.01),
                    f18: f104,
                    f20: Math.round(mvYi * 100000000 / price),
                    f21: f21,
                    f26: f26,
                    f100: industries[i % industries.length],
                    f102: ['北京', '上海', '广东', '浙江', '江苏', '四川'][i % 6],
                    f103: concepts[i % concepts.length],
                    f104: f104,
                    f615: f615,
                    f630: Math.floor(Math.random() * 3)
                });
            }
            return mockStocks;
        }

        async function fetchAndCache(){
            try{ document.getElementById('allStockTableArea').innerHTML='<div class="loading-placeholder"><div class="spinner"></div>四维评分中(价格/量能/封单/板块地位)...</div>';
                let resp=await fetch(getStockApiUrl()); let json=await resp.json();
                if(json.rc!==0||!json.data?.diff) throw new Error('数据异常');
                allRawStocks=json.data.diff; cachedStocks=processAllStocks(allRawStocks); isDataCached=true; renderAll(); showToast('✅ 评分完成(四维积分制)','success');
            } catch(e){ 
                console.warn('API失败，使用模拟数据:', e.message);
                allRawStocks=generateMockRawStocks(); 
                cachedStocks=processAllStocks(allRawStocks); 
                isDataCached=true; 
                renderAll(); 
                showToast('⚠️ API失败，已使用模拟数据','warning'); 
            }
        }
        function updateRealTimeOnly(){ if(!isDataCached){ fetchAndCache(); return; } fetch(getStockApiUrl()).then(r=>r.json()).then(json=>{ if(json.data?.diff) json.data.diff.forEach(s=>{ let it=cachedStocks.find(x=>x.code===s.f12); if(it){ it.realChange=parseFloat(s.f3||0); it.entityChange=getEntityChange(s); } }); renderAll(); showToast('实时涨幅已更新','success'); }).catch(()=>showToast('更新失败','error')); }
        function reLockData(){ isDataCached=false; cachedStocks=[]; allRawStocks=[]; fetchAndCache(); }
        function exportStocks(count){ var list=cachedStocks.slice(0,count); if(!list.length){ showToast('无数据','error'); return; } var txt=list.map(function(it){ return (it.code||'')+(it.name?(' '+it.name):''); }).filter(Boolean).join('\n'); copyText(txt,'✅ 已复制 '+list.length+' 只股票代码'); }
        window.openWebKline=function(code){if(!code)return;let m=code.startsWith("6")||code.startsWith("9")?"sh":(code.startsWith("4")||code.startsWith("8")?"bj":"sz");window.open("https://quote.eastmoney.com/"+m+code+".html","_blank");};
        window.linkToSoftware=function(code){ if(!code)return; openStockKline(code); };
        
        function renderMedalArea(){
            let container=document.getElementById('medalArea');
            if(!cachedStocks.length){ container.innerHTML='<div class="empty-state">暂无符合条件股票</div>'; return; }
            let tops=cachedStocks.slice(0,5);
            let rankNames=['🏅 金牌','🥈 银牌','🥉 铜牌','第四名','第五名'];
            let html=''; tops.forEach((item,idx)=>{ let realCls=item.realChange<item.bidChange?'green-real':''; html+=`<div class="medal-card"><div class="medal-rank">${rankNames[idx]}</div><div class="medal-name-big">${item.name}</div><div class="medal-code" onclick="linkToSoftware('${item.code}')">${item.code}<span class="web-kline-btn" onclick="event.stopPropagation();openWebKline('${item.code}')" title="网页K线">🌐</span></div><div class="medal-prob-big">${item.probability}分</div><div class="medal-detail"><span>竞涨幅${item.bidChange>0?'+':''}${item.bidChange.toFixed(2)}%</span><span>可信${item.confidence}%</span></div><div class="medal-real-chg ${realCls}">实时涨幅${item.realChange>0?'+':''}${item.realChange.toFixed(2)}%</div></div>`; });
            container.innerHTML=html;
            document.getElementById('stockCountBadge').innerHTML=`符合条件: ${cachedStocks.length}只`;
        }
        function renderAllStockTable(){
            let container=document.getElementById('allStockTableArea');
            if(!isDataCached||!cachedStocks.length){ container.innerHTML='<div class="empty-state">暂无符合条件股票</div>'; return; }
            let html=`<table class="stock-table"><thead><tr><th>排名</th><th>代码</th><th>名称</th><th>竞价涨幅</th><th>实时涨幅</th><th>实体涨幅</th><th>流通市值(亿)</th><th>异动</th><th>行业</th><th>概念</th><th>综合评分(总分)</th><th>可信度</th></tr></thead><tbody>`;
            cachedStocks.forEach((item,idx)=>{ let rc=item.realChange<item.bidChange?'real-green':(item.realChange>0?'up':'down'); let warnL=item.warnType===5?'🔥强':item.warnType===4?'⚡中':item.warnType===3?'↑弱':'-'; let mvDisplay=item.circulationMV?item.circulationMV.toFixed(2):'0.00'; html+=`<tr><td class="rank-col">${idx+1}</td><td class="code-click" onclick="linkToSoftware('${item.code}')">${item.code}<span class="web-kline-btn" onclick="event.stopPropagation();openWebKline('${item.code}')" title="网页K线">🌐</span></td><td>${item.name}</td><td class="${item.bidChange>0?'up':'down'}">${item.bidChange>0?'+':''}${item.bidChange.toFixed(2)}%</td><td class="${rc}">${item.realChange>0?'+':''}${item.realChange.toFixed(2)}%</td><td class="${item.entityChange>0?'up':'down'}">${item.entityChange>0?'+':''}${item.entityChange.toFixed(2)}%</td><td>${mvDisplay}</td><td>${warnL}</td><td>${item.industry}</td><td style="max-width:180px;">${item.concept}</td><td class="up">${item.probability}分</td><td>${item.confidence}%</td></tr>`; });
            container.innerHTML=html+'</tbody></table>';
        }
        function renderAll(){ renderMedalArea(); renderAllStockTable(); }
        
        function readFilterFromDOM(){ filterSettings={ stSuspend:document.getElementById('filterST').checked, excludeNewStock:document.getElementById('filterNewStock').checked, bidEnabled:document.getElementById('bidRangeEnable').checked, bidMin:parseFloat(document.getElementById('bidMin').value)||0, bidMax:parseFloat(document.getElementById('bidMax').value)||20, mvEnabled:document.getElementById('mvRangeEnable').checked, mvMin:parseFloat(document.getElementById('mvMin').value)||5, mvMax:parseFloat(document.getElementById('mvMax').value)||300, boardEnabled:document.getElementById('boardRangeEnable').checked, boardMin:parseInt(document.getElementById('boardMin').value)||0, boardMax:parseInt(document.getElementById('boardMax').value)||6, priceEnabled:document.getElementById('priceRangeEnable').checked, priceMin:parseFloat(document.getElementById('priceMin').value)||2, priceMax:parseFloat(document.getElementById('priceMax').value)||100 }; }
        function updateFilterInputsFromSettings(s){ document.getElementById('filterST').checked=s.stSuspend; document.getElementById('filterNewStock').checked=s.excludeNewStock; document.getElementById('bidRangeEnable').checked=s.bidEnabled; document.getElementById('bidMin').value=s.bidMin; document.getElementById('bidMax').value=s.bidMax; document.getElementById('mvRangeEnable').checked=s.mvEnabled; document.getElementById('mvMin').value=s.mvMin; document.getElementById('mvMax').value=s.mvMax; document.getElementById('boardRangeEnable').checked=s.boardEnabled; document.getElementById('boardMin').value=s.boardMin; document.getElementById('boardMax').value=s.boardMax; document.getElementById('priceRangeEnable').checked=s.priceEnabled; document.getElementById('priceMin').value=s.priceMin; document.getElementById('priceMax').value=s.priceMax; }
        function updateFilterLockUI(){ let box=document.getElementById('filterBox'),btn=document.getElementById('lockFilterBtn'),ind=document.getElementById('lockIndicator'),applyBtn=document.getElementById('applyFilterBtn'),resetBtn=document.getElementById('resetFilterBtn'); if(isFilterLocked){ box.classList.add('filter-locked'); btn.classList.add('locked'); btn.innerHTML='🔓 解锁'; ind.style.display='inline-block'; if(applyBtn) applyBtn.disabled=true; if(resetBtn) resetBtn.disabled=true; }else{ box.classList.remove('filter-locked'); btn.classList.remove('locked'); btn.innerHTML='🔒 锁定'; ind.style.display='none'; if(applyBtn) applyBtn.disabled=false; if(resetBtn) resetBtn.disabled=false; } }
        function saveLockedFilter(s){ localStorage.setItem(LOCKED_FILTER_KEY,JSON.stringify({locked:true,settings:s})); }
        function clearLockedFilter(){ localStorage.removeItem(LOCKED_FILTER_KEY); }
        function loadLockedFilter(){ try{ let d=localStorage.getItem(LOCKED_FILTER_KEY); if(d){ let p=JSON.parse(d); if(p.locked&&p.settings) return p; } }catch(e){} return null; }
        function toggleFilterLock(){ if(isFilterLocked){ isFilterLocked=false; clearLockedFilter(); updateFilterLockUI(); showToast('🔓 筛选已解锁','success'); }else{ readFilterFromDOM(); saveLockedFilter(filterSettings); isFilterLocked=true; updateFilterLockUI(); showToast('🔒 筛选锁定','success'); } }
        function initLockState(){ let lockedData=loadLockedFilter(); if(lockedData&&lockedData.settings){ isFilterLocked=true; filterSettings={...lockedData.settings}; updateFilterInputsFromSettings(filterSettings); updateFilterLockUI(); }else{ isFilterLocked=false; updateFilterInputsFromSettings(filterSettings); updateFilterLockUI(); } }
        function applyCustomFilter(){ if(isFilterLocked){ showToast('🔒 已锁定,请先解锁','error'); return; } readFilterFromDOM(); if(isDataCached&&allRawStocks.length){ cachedStocks=processAllStocks(allRawStocks); renderAll(); showToast('筛选已应用(四维评分)','success'); }else fetchAndCache(); }
        function resetFilterToDefault(){ if(isFilterLocked){ showToast('锁定状态无法重置','error'); return; } let def={ stSuspend:true, excludeNewStock:true, bidEnabled:true, bidMin:0, bidMax:20, mvEnabled:true, mvMin:5, mvMax:300, boardEnabled:true, boardMin:0, boardMax:6, priceEnabled:true, priceMin:2, priceMax:100 }; filterSettings={...def}; updateFilterInputsFromSettings(filterSettings); if(isDataCached&&allRawStocks.length){ cachedStocks=processAllStocks(allRawStocks); renderAll(); } showToast('重置默认筛选(竞价下限0%)','success'); }
        
        function loadPoolFromStorage(){ try{ let r=localStorage.getItem(STORAGE_KEY); if(r){ let d=JSON.parse(r); if(d.autoPoolLockTime && Date.now()-d.autoPoolLockTime>LOCK_DURATION_MS) return {stocks:[],autoPoolLockTime:null}; return {stocks:d.stocks||[],autoPoolLockTime:d.autoPoolLockTime||null}; } }catch(e){} return {stocks:[],autoPoolLockTime:null}; }
        function savePoolToStorage(){ localStorage.setItem(STORAGE_KEY,JSON.stringify({stocks:stockPool,autoPoolLockTime})); }
        function renderStockPool(){ let c=document.getElementById('poolListContainer'); if(!stockPool.length){ c.innerHTML='<div class="empty-pool">暂无股票，9:30前系统自动将前五名选入池中</div>'; return; } let h=''; stockPool.forEach(item=>{ h+=`<div class="pool-item"><div><div>${item.name}</div><div class="pool-stock-code" onclick="linkToSoftware('${item.code}')">${item.code}<span class="web-kline-btn" onclick="event.stopPropagation();openWebKline('${item.code}')" title="网页K线">🌐</span></div><div style="font-size:10px;">📅 ${item.addTime}</div></div><button class="del-single" data-code="${item.code}">移除</button></div>`; }); c.innerHTML=h; document.querySelectorAll('.del-single').forEach(b=>{ b.onclick=()=>{ stockPool=stockPool.filter(s=>s.code!==b.dataset.code); savePoolToStorage(); renderStockPool(); }; }); }
        function addStocksToPool(stks){ stks.forEach(s=>{ if(!stockPool.some(x=>x.code===s.code)) stockPool.push({code:s.code,name:s.name,addTime:new Date().toLocaleTimeString()}); }); savePoolToStorage(); renderStockPool(); }
        function manualAddCurrentTop5(){ if(cachedStocks.length) addStocksToPool(cachedStocks.slice(0,5)); else showToast('无数据','error'); }
        function autoAddTask(){ let h=new Date().getHours(),m=new Date().getMinutes(); if(autoPoolLockTime && stockPool.length && Date.now()-autoPoolLockTime<=LOCK_DURATION_MS) return; if((h<9||(h===9&&m<30)) && cachedStocks.length && !stockPool.length){ addStocksToPool(cachedStocks.slice(0,5)); autoPoolLockTime=Date.now(); savePoolToStorage(); renderStockPool(); } }
        function clearPool(){ stockPool=[]; autoPoolLockTime=null; savePoolToStorage(); renderStockPool(); }
        function exportPoolToTdx(){ if(!stockPool.length){ showToast('池空','error'); return; } var txt=stockPool.map(function(i){ return (i.code||'')+(i.name?(' '+i.name):''); }).filter(Boolean).join('\n'); copyText(txt,'✅ 已复制股票池 '+stockPool.length+' 只代码'); }
        function showToast(msg){ let d=document.createElement('div'); d.className='toast-msg'; d.innerHTML=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),2000); }
        function updateBeijingTime(){ let now=new Date(); let bj=new Date(now.getTime()+8*3600000+now.getTimezoneOffset()*60000); document.querySelector('.time-digital').textContent=bj.toLocaleTimeString('zh-CN',{hour12:false}); document.getElementById('refreshLockedBtn').disabled=!(bj.getHours()<9||(bj.getHours()===9&&bj.getMinutes()<30)); }
        function onMarketChanged(){ isDataCached=false; cachedStocks=[]; allRawStocks=[]; fetchAndCache(); }
        
        function init(){ let poolData=loadPoolFromStorage(); stockPool=poolData.stocks; autoPoolLockTime=poolData.autoPoolLockTime; renderStockPool(); initLockState(); document.getElementById('refreshLockedBtn').onclick=reLockData; document.getElementById('refreshRealTimeBtn').onclick=updateRealTimeOnly; document.getElementById('applyFilterBtn').onclick=applyCustomFilter; document.getElementById('resetFilterBtn').onclick=resetFilterToDefault; document.getElementById('lockFilterBtn').onclick=toggleFilterLock; document.getElementById('exportMedalBtn').onclick=()=>exportStocks(parseInt(document.getElementById('medalExportCount').value)); document.getElementById('exportAllBtn').onclick=()=>exportStocks(cachedStocks.length); document.getElementById('manualAddCurrentBtn').onclick=manualAddCurrentTop5; document.getElementById('clearPoolBtn').onclick=clearPool; document.getElementById('exportPoolBtn').onclick=exportPoolToTdx; ['marketMainBoard','marketSciTech','marketGrowth'].forEach(id=>{ document.getElementById(id).addEventListener('change',onMarketChanged); }); document.getElementById('marketSelectAllBtn').onclick=()=>{ ['marketMainBoard','marketSciTech','marketGrowth'].forEach(id=>document.getElementById(id).checked=true); onMarketChanged(); }; fetchAndCache(); setInterval(updateBeijingTime,1000); setInterval(autoAddTask,20000); }
        window.addEventListener('DOMContentLoaded', init);
    })();

// ===== 手机版适配补丁：剪贴板助手（替换通达信导出） =====
(function(){
function copyText(text, msg){
  var showMsg=function(m){
    var d=document.createElement('div');
    d.style.cssText='position:fixed;bottom:44px;left:50%;transform:translateX(-50%);background:#ff3a3a;color:#fff;padding:9px 20px;border-radius:30px;font-size:13px;z-index:99999;max-width:90%;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,0.4);';
    d.textContent=m;
    document.body.appendChild(d);
    setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); },2600);
  };
  var done=function(){ showMsg(msg||'已复制到剪贴板'); };
  var fb=function(t,cb){
    try{
      var ta=document.createElement('textarea');
      ta.value=t; ta.style.cssText='position:fixed;top:0;left:0;opacity:0;';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try{ document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta);
    }catch(e){}
    cb();
  };
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(function(){ fb(text,done); });
    } else fb(text,done);
  }catch(e){ fb(text,done); }
}
window.copyText=copyText;
})();

// ===== K线打开：优先唤起手机通达信/同花顺App，失败自动回退网页K线 =====
function _stkPref(){
  try{ var v=localStorage.getItem('stk_kline_pref'); if(v) return v; }catch(e){}
  return 'auto';
}
function openStockKline(code){
  if(!code) return;
  code=String(code).replace(/[^0-9]/g,'').slice(0,6);
  if(!code) return;
  var p=_stkPref();
  if(p==='web'){ _stkWeb(code); return; }
  var list=[];
  if(p==='tdx'||p==='auto') list.push('tdx://'+code);
  if(p==='ths'||p==='auto') list.push('amihexin://?type=stock&code='+code);
  _stkTry(code,list,0);
}
function _stkTry(code,list,i){
  if(i>=list.length){ _stkWeb(code); return; }
  var hit=false;
  var done=function(){ hit=true; };
  document.addEventListener('visibilitychange',done);
  window.addEventListener('pagehide',done);
  window.addEventListener('blur',done);
  try{ window.location.href=list[i]; }catch(e){}
  setTimeout(function(){
    document.removeEventListener('visibilitychange',done);
    window.removeEventListener('pagehide',done);
    window.removeEventListener('blur',done);
    if(hit || (typeof document.hidden==='boolean' && document.hidden)) return;
    _stkTry(code,list,i+1);
  },900);
}
function _stkWeb(code){
  var mk=/^(60|68|90)/.test(code)?'sh':(/^(00|30)/.test(code)?'sz':'bj');
  try{ if(typeof openWebKline==='function'){ openWebKline(code); return; } }catch(e){}
  try{ if(typeof openKline==='function'){ openKline(code); return; } }catch(e){}
  window.open('https://quote.eastmoney.com/'+mk+code+'.html','_blank');
}
function _stkPrefLabel(p){
  return p==='tdx'?'通达信':(p==='ths'?'同花顺':(p==='web'?'网页K线':'自动'));
}
