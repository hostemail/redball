    // 板块排名
    function _buildSector(stocks) {
        var map = new Map();
        for (var i=0; i<stocks.length; i++) {
            var s = stocks[i];
            var ind = s.industry || '';
            if (ind) {
                if (!map.has(ind)) map.set(ind, []);
                map.get(ind).push({ code: s.code, bid: s.bidChange });
            }
        }
        var result = new Map();
        for (var [ind, list] of map.entries()) {
            list.sort(function(a,b){ return b.bid - a.bid; });
            var rmap = new Map();
            for (var j=0; j<list.length; j++) rmap.set(list[j].code, j+1);
            result.set(ind, { rank: rmap, total: list.length });
        }
        return result;
    }

    function _computeScore(stk, sectorMap) {
        var bid = stk.bidChange;
        var raw = stk.rawStock;
        var bv = parseFloat(raw.f5||0), mv = parseFloat(raw.f10||0), price = stk.price;
        var volRatio = (mv>0 && price>0 && bv>0) ? (bv*price)/(mv*100) : 0;
        var volScore = volRatio>=1.5 ? 30 : (volRatio>=1 ? 25 : (volRatio>=0.5 ? 20 : (volRatio>=0.3 ? 10 : 0)));
        var yc = raw.f4||0;
        var priceScore = 5;
        if (yc>0 && price/yc>=0.995 && bid>=9.5) priceScore = 30;
        else if (bid>=9.9) priceScore = 30;
        else if (bid>=7) priceScore = 25;
        else if (bid>=5) priceScore = 20;
        else if (bid>=3) priceScore = 10;
        else if (bid<0) priceScore = 0;
        var limitPct = (stk.code.startsWith('688')||stk.code.startsWith('30')) ? 0.2 : 0.1;
        var limitPrice = yc * (1 + limitPct);
        var dist = Math.max(0, (limitPrice - price) / limitPrice);
        var stab = 10 * (1 - Math.min(1, dist));
        var mom = Math.min(10, (volRatio/1.5)*10);
        var strength = Math.min(20, Math.max(10, stab + mom));
        var ind = stk.industry || '';
        var sectorScore = 5;
        if (ind && sectorMap.has(ind)) {
            var info = sectorMap.get(ind);
            var rank = info.rank.get(stk.code) || 999;
            var total = info.total;
            var mv2 = stk.circulationMV || 0;
            var isTop = rank <= Math.max(1, Math.floor(total*0.15));
            var isFront = rank <= Math.max(3, Math.floor(total*0.3));
            if (isTop && mv2<80) sectorScore = 20;
            else if (isTop) sectorScore = 18;
            else if (isFront && mv2<120) sectorScore = 15;
            else if (isFront) sectorScore = 12;
            else if (rank <= Math.min(8, total*0.5)) sectorScore = 8;
        }
        var totalRaw = priceScore + volScore + strength + sectorScore;
        if (bid<0 || volRatio<0.3) totalRaw = Math.min(totalRaw, 45);
        totalRaw = Math.min(100, Math.max(0, totalRaw));
        return { total: Math.round(totalRaw) };
    }

    function _checkVol(stk) {
        var raw = stk.rawStock;
        var vol = parseFloat(raw.f5||0);
        var avg = parseFloat(raw.f20||1);
        if (avg<=0) return true;
        var ratio = (vol*240)/avg;
        return ratio < stk.bidChange;
    }

    function _processStocks(rawArr, boardMap) {
        var base = [];
        for (var i=0; i<rawArr.length; i++) {
            var stk = rawArr[i];
            var bid = (stk.f615!=null && !isNaN(stk.f615)) ? parseFloat(stk.f615) : parseFloat(stk.f3||0);
            var real = parseFloat(stk.f3||0);
            var mv = parseFloat(stk.f21||0)/100000000;
            var price = parseFloat(stk.f2||0);
            var board = boardMap.get(stk.f12) || 0;
            var industry = stk.f100 || '-';
            var o = parseFloat(stk.f17||0), c = parseFloat(stk.f2||0);
            var entity = o===0 ? 0 : ((c-o)/o)*100;
            base.push({ code: stk.f12, name: stk.f14, bidChange: bid, realChange: real, entityChange: entity, circulationMV: mv, price: price, boardCount: board, industry: industry, rawStock: stk });
        }
        var sectorMap = _buildSector(base);
        var enriched = [];
        for (var j=0; j<base.length; j++) {
            var item = base[j];
            var score = _computeScore(item, sectorMap);
            item.probability = score.total;
            enriched.push(item);
        }
        enriched.sort(function(a,b){ return b.probability - a.probability; });
        return enriched;
    }

    function _applyFilters(list, settings) {
        return list.filter(function(item){
            var raw = item.rawStock;
            if (settings.st && (_isST(item.name) || _isSus(raw))) return false;
            if (settings.new && raw && raw.f26) {
                var days = _getDays(raw.f26);
                if (days!==null && days<10) return false;
            }
            if (settings.bid && (item.bidChange<settings.bidMin || item.bidChange>settings.bidMax)) return false;
            if (settings.mv && (item.circulationMV<settings.mvMin || item.circulationMV>settings.mvMax)) return false;
            if (settings.board) {
                var b = item.boardCount;
                if (settings.boardMin>settings.boardMax) return false;
                if (b<settings.boardMin || b>settings.boardMax) return false;
            }
            if (settings.price && (item.price<settings.priceMin || item.price>settings.priceMax)) return false;
            if (!_checkVol(item)) return false;
            return true;
        });
    }

                _renderTable();
                _syncPool();
            } else { _fetchData(); }
            _showMsg('筛选已应用');
        };

        // 锁定
        document.getElementById('lockFilterBtn').onclick = function(){
            _state._locked = !_state._locked;
            _s('auction_lock_v3_enc', { locked: _state._locked, settings: _state._filter });
            _toggleLockUI();
            _showMsg(_state._locked ? '已锁定' : '已解锁');
        };

        // 导出
        document.getElementById('exportMedalBtn').onclick = function(){
            var cnt = parseInt(document.getElementById('medalExportCount').value);
            _exportTopN(cnt);
        };
        document.getElementById('exportPoolBtn').onclick = _exportPool;
        document.getElementById('manualAddCurrentBtn').onclick = function(){
            if (_state._cached.length) _addToPool(_state._cached.slice(0,3));
            else _showMsg('无数据');
        };
        document.getElementById('clearPoolBtn').onclick = function(){
            _state._pool = [];
            _state._lockTime = null;
            _savePool();
            _renderPool();
            _showMsg('已清空');
        };

        // 市场切换
        ['marketMainBoard','marketSciTech','marketGrowth'].forEach(function(id){
            document.getElementById(id).addEventListener('change', function(){ _state._ready = false; _fetchData(); });
        });

        // 时钟
        setInterval(function(){
            var el = document.querySelector('.time-digital');
            if (el) el.textContent = _tl();
        }, 1000);

        // 自动入池
        setInterval(_autoAddTask, 20000);

        // 倒计时
        function _startCountdown() {
            if (_state._cdTimer) clearInterval(_state._cdTimer);
            _state._countdown = 60;
            _updateCD();
            _state._cdTimer = setInterval(function(){
                _state._countdown -= 1;
                if (_state._countdown <= 0) { _state._countdown = 60; _updateReal(); }
                _updateCD();
            }, 1000);
        }
        function _updateCD() {
            var el = document.getElementById('countdownNumber');
            if (el) el.textContent = _state._countdown;
        }
        _fetchData().then(function(){ _startCountdown(); });
    }

    function _toggleLockUI() {
        var btns = document.querySelectorAll('.top-actions-group .mode-btn');
        for (var i=0; i<btns.length; i++) btns[i].disabled = _state._locked;
        var inputs = document.querySelectorAll('#filterBox input, #filterBox select');
        for (var j=0; j<inputs.length; j++) {
            if (inputs[j].id !== 'lockFilterBtn' && inputs[j].id !== 'applyFilterBtn') {
                inputs[j].disabled = _state._locked;
            }
        }
        var lockBtn = document.getElementById('lockFilterBtn');
        if (lockBtn) lockBtn.innerHTML = _state._locked ? '🔓 解锁' : '🔒 锁定';
        var applyBtn = document.getElementById('applyFilterBtn');
        if (applyBtn) applyBtn.disabled = _state._locked;
        if (!_state._locked && _state._ready && _state._raw.length) {
            var processed = _processStocks(_state._raw, _state._boardMap);
            _state._cached = _applyFilters(processed, _state._filter);
            _renderTable();
            _syncPool();
        }
    }

    function _updateModeUI() {
        var tdx = document.getElementById('modeTdxBtn');
        var dzh = document.getElementById('modeDzhBtn');
        if (_state._mode === 'tdx') { tdx.classList.add('active'); dzh.classList.remove('active'); }
        else { dzh.classList.add('active'); tdx.classList.remove('active'); }
        var fn = document.querySelector('.footnote');
        if (fn) fn.innerHTML = '<i class="fa fa-bullhorn"></i> 评分维度:价格+量能+封单强度+板块地位 | 点击代码/名称唤起通达信/同花顺 · 🌐网页K线;
        _s('auction_mode_v3_enc', { mode: _state._mode });
    }

    window.addEventListener('DOMContentLoaded', _initUI);
})();

// ===== 手机版适配补丁：剪贴板助手（替换通达信导出） =====
(function(){
function copyText(text, msg){
  var showMsg=function(m){
    var d=document.createElement('div');
    d.style.cssText='position:fixed;bottom:44px;left:50%;transform:translateX(-50%);background:#ff3a3a;color:#fff;padding:9px 20px;border-radius:30px;font-size:13px;z-index:99999;max-width:90%;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,0.4);';
    d.textContent=m;
    document.body.appendChild(d);
    setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); },2600);
  };
  var done=function(){ showMsg(msg||'已复制到剪贴板'); };
  var fb=function(t,cb){
    try{
      var ta=document.createElement('textarea');
      ta.value=t; ta.style.cssText='position:fixed;top:0;left:0;opacity:0;';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try{ document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta);
    }catch(e){}
    cb();
  };
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(function(){ fb(text,done); });
    } else fb(text,done);
  }catch(e){ fb(text,done); }
}
window.copyText=copyText;
})();

// ===== K线打开：优先唤起手机通达信/同花顺App，失败自动回退网页K线 =====
function _stkPref(){
  try{ var v=localStorage.getItem('stk_kline_pref'); if(v) return v; }catch(e){}
  return 'auto';
}
function openStockKline(code){
  if(!code) return;
  code=String(code).replace(/[^0-9]/g,'').slice(0,6);
  if(!code) return;
  var p=_stkPref();
  if(p==='web'){ _stkWeb(code); return; }
  var list=[];
  if(p==='tdx'||p==='auto') list.push('tdx://'+code);
  if(p==='ths'||p==='auto') list.push('amihexin://?type=stock&code='+code);
  _stkTry(code,list,0);
}
function _stkTry(code,list,i){
  if(i>=list.length){ _stkWeb(code); return; }
  var hit=false;
  var done=function(){ hit=true; };
  document.addEventListener('visibilitychange',done);
  window.addEventListener('pagehide',done);
  window.addEventListener('blur',done);
  try{ window.location.href=list[i]; }catch(e){}
  setTimeout(function(){
    document.removeEventListener('visibilitychange',done);
    window.removeEventListener('pagehide',done);
    window.removeEventListener('blur',done);
    if(hit || (typeof document.hidden==='boolean' && document.hidden)) return;
    _stkTry(code,list,i+1);
  },900);
}
function _stkWeb(code){
  var mk=/^(60|68|90)/.test(code)?'sh':(/^(00|30)/.test(code)?'sz':'bj');
  try{ if(typeof openWebKline==='function'){ openWebKline(code); return; } }catch(e){}
  try{ if(typeof openKline==='function'){ openKline(code); return; } }catch(e){}
  window.open('https://quote.eastmoney.com/'+mk+code+'.html','_blank');
}
function _stkPrefLabel(p){
  return p==='tdx'?'通达信':(p==='ths'?'同花顺':(p==='web'?'网页K线':'自动'));
}
</script>
